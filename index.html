<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Pixel Runner — jogo de plataforma 2D em pixel art feito com Phaser 3 por Arthur Souza Soares." />
    <meta name="theme-color" content="#1a1c2c" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Pixel Runner</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #1a1c2c;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      noscript {
        color: #f4f4f4;
        font-family: monospace;
        display: block;
        padding: 2rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <noscript>Ative o JavaScript para jogar o Pixel Runner.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
